name: Free beta interest
description: Public, privacy-minimising demand signal for the customer-owned Android relay.
title: "[Beta interest]: "
labels: ["type:story"]
body:
  - type: markdown
    attributes:
      value: |
        감사합니다. 이 양식은 공개 GitHub Issue로 작성됩니다.

        카카오 ID, 전화번호, 이메일, 기기 일련번호, 알림·대화 내용, webhook URL, 토큰, 비밀값은 절대 적지 마세요.
        이 양식은 무료 베타 수요와 비구속적 가격 반응을 확인할 뿐, 설치 가능 시점·기능·지원·유료 혜택을 약속하지 않습니다.
  - type: dropdown
    id: destination
    attributes:
      label: 관심 있는 전달 목적지
      options:
        - Discord
        - Telegram
        - HTTPS webhook
        - 아직 결정하지 않음
    validations:
      required: true
  - type: dropdown
    id: intended_use
    attributes:
      label: 생각 중인 사용처 범주
      description: 공개 가능한 범주만 고르세요. 대화방 이름, 알림·메시지 내용, 조직명, URL, 연락처는 작성하지 않습니다.
      options:
        - 개인 Android의 선택 알림을 내 도구에서 다시 보기
        - 선택한 알림을 팀 Discord에서 함께 보기
        - 내 HTTPS webhook으로 제한된 자동화 연결
        - 아직 구체적인 사용처를 정하지 않음
    validations:
      required: true
  - type: dropdown
    id: discovery_channel
    attributes:
      label: 이 공개 실험을 어디에서 발견하셨나요? (선택)
      description: 집계용 선택 항목입니다. 공개 Issue에 구체적인 사람, 검색어, URL, 연락처를 추가하지 마세요.
      options:
        - StatPan 포트폴리오 또는 경계 설명 글
        - GitHub 저장소 또는 GitHub 검색
        - 웹 검색
        - 직접 공유받음
        - 기억나지 않음
    validations:
      required: false
  - type: dropdown
    id: installation_willingness
    attributes:
      label: 수동 설치 의향
      description: 서명된 APK가 준비된 경우에만 답해 주세요. 설치와 Android 알림 접근 권한 설정은 사용자가 직접 수행합니다.
      options:
        - 서명된 APK를 수동 설치하고 알림 접근 권한을 설정해 볼 의향이 있습니다.
        - 설치 전에 더 알아보고 싶습니다.
        - 지금은 설치 의향 없이 사용처만 탐색 중입니다.
    validations:
      required: true
  - type: dropdown
    id: price_reaction
    attributes:
      label: 지불 방식과 가격에 대한 반응
      description: 결제나 예약이 아닌 공개·비구속적 의견입니다. 현재 수금 경로와 유료 혜택은 없으며, 월 선택지는 반복 제공이 실제로 생기는 경우만 가정합니다.
      options:
        - 무료 테스트만 고려합니다.
        - 일회성 구매 1,000–4,900원
        - 일회성 구매 5,000–9,900원
        - 일회성 구매 10,000원 이상
        - 월 1,000–2,900원 (반복 제공이 실제로 생기는 경우)
        - 월 3,000–4,900원 (반복 제공이 실제로 생기는 경우)
        - 월 5,000원 이상 (반복 제공이 실제로 생기는 경우)
        - 아직 판단할 수 없습니다.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 확인
      options:
        - label: 이 Issue가 공개됨을 이해하며, 개인 정보나 메시지·인증 정보를 작성하지 않았습니다.
          required: true
        - label: 이것은 카카오톡 공식 API나 봇이 아니며, 무료 베타 관심 신호임을 이해합니다.
          required: true
